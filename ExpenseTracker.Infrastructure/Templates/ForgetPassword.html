<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title></title>
    <style type="text/css">
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f4f6;
            color: #51545e;
            margin: 0;
        }

        .email-body_inner {
            width: 570px;
            margin: 0 auto;
            padding: 45px;
            background-color: #ffffff;
        }

        h1 {
            color: #333333;
            font-size: 22px;
        }

        .button {
            background-color: #22bc66;
            color: #fff;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 4px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="email-body_inner">
        <h1>Hi {{name}},</h1>
        <p>You recently requested to reset your password for your ExpenseTracker account. Use the button below to reset it.</p>
        <p><a href="{{action_url}}" class="button" target="_blank">Reset your password</a></p>
        <p>Thanks,<br />ExpenseTracker team</p>
        <p style="font-size:13px;color:#85878e;">If you're having trouble with the button above, copy and paste the URL below into your web browser.</p>
        <p style="font-size:13px;">{{action_url}}</p>
    </div>
</body>
</html>
